{% extends "base.html" %}
{% block title %}Create a ticket{% endblock %}

{% block content %}
<div class="card ticket-form">
  <div class="form-heading">
    <h1>How can we help?</h1>
    <p class="muted">Submit an IT support request. Use your email to check its status later.</p>
  </div>

  <form method="post">
    <div class="form-grid">
      <div class="form-field">
        <label for="name">Your name</label>
        <input id="name" name="name" autocomplete="name" placeholder="Name" required>
      </div>

      <div class="form-field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email"
               placeholder="you@example.com" required>
      </div>

      <div class="form-field full-width">
        <label for="title">Issue title</label>
        <input id="title" name="title" placeholder="Briefly summarize the problem" required>
      </div>

      <div class="form-field full-width">
        <label for="description">Describe the issue</label>
        <textarea id="description" name="description"
                  placeholder="What happened? Include any error messages and steps to reproduce the issue."
                  required></textarea>
      </div>
    </div>

    <button type="submit">Submit ticket →</button>
  </form>
</div>
{% endblock %}
