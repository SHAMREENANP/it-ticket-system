<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IT Help Desk{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #172554;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --text: #172033;
      --muted: #64748b;
      --border: #e2e8f0;
      --surface: #ffffff;
      --background: #f4f7fc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at top left, #e8efff 0, transparent 38%),
        var(--background);
      color: var(--text);
      font: 16px/1.6 "DM Sans", Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(120deg, #172554, #1e40af);
      color: white;
      padding: 18px max(7%, calc((100% - 1100px) / 2));
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px #17255425;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.3px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      background: #ffffff20;
      border: 1px solid #ffffff30;
      border-radius: 12px;
      font-size: 19px;
    }

    header nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header nav a {
      color: #eef2ff;
      text-decoration: none;
      padding: 9px 13px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      transition: background .2s, transform .2s;
    }

    header nav a:hover {
      background: #ffffff20;
      transform: translateY(-1px);
    }

    main {
      width: min(100% - 36px, 1050px);
      margin: 42px auto;
    }

    .card {
      background: var(--surface);
      padding: 30px;
      border: 1px solid #e9eef6;
      border-radius: 18px;
      box-shadow: 0 12px 35px #1725540c;
      margin-bottom: 22px;
    }

    h1, h2, h3 { line-height: 1.25; letter-spacing: -.5px; }
    h1 { margin: 0 0 12px; font-size: clamp(26px, 4vw, 34px); }
    h2 { margin-top: 0; }
    p { margin-top: 0; }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin: 18px 0 7px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: white;
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px #2563eb18;
    }

    textarea { min-height: 130px; resize: vertical; }

    button, .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--blue);
      color: white;
      border: 0;
      padding: 11px 18px;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      font: inherit;
      font-weight: 600;
      transition: background .2s, transform .2s, box-shadow .2s;
    }

    button:hover, .button:hover {
      background: var(--blue-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 15px #2563eb35;
    }

    .button { margin-top: 16px; }

    .notice {
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
      padding: 13px 16px;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .ticket {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin: 14px 0;
      transition: border-color .2s, box-shadow .2s, transform .2s;
    }

    .ticket:hover {
      border-color: #bfdbfe;
      box-shadow: 0 8px 20px #1725540c;
      transform: translateY(-2px);
    }

    .status {
      display: inline-block;
      background: #eef2ff;
      color: #4338ca;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .muted { color: var(--muted); }

    .admin-form {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .admin-form select { max-width: 200px; }

    @media (max-width: 600px) {
      header {
        padding: 16px 18px;
        display: block;
      }

      header nav {
        margin-top: 14px;
        flex-wrap: wrap;
      }

      header nav a { padding: 8px 10px; }
      main { margin: 26px auto; }
      .card { padding: 22px; border-radius: 14px; }

      .admin-form {
        align-items: stretch;
        flex-direction: column;
      }

      .admin-form select { max-width: none; }
    }
    /* Ticket form */
.ticket-form {
  max-width: 720px;
  margin: 0 auto;
}

.form-heading {
  margin-bottom: 28px;
}

.form-heading h1 {
  margin-bottom: 8px;
}

.form-heading p {
  margin-bottom: 0;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 18px;
}

.form-field {
  margin-bottom: 4px;
}

.form-field.full-width {
  grid-column: 1 / -1;
}

.ticket-form input,
.ticket-form textarea {
  background: #f8fafc;
}

.ticket-form input:hover,
.ticket-form textarea:hover {
  border-color: #94a3b8;
}

.ticket-form button {
  margin-top: 20px;
  min-width: 160px;
}

@media (max-width: 600px) {
  .form-grid {
    grid-template-columns: 1fr;
  }

  .form-field.full-width {
    grid-column: auto;
  }

  .ticket-form button {
    width: 100%;
  }
}
  </style>
</head>

<body>
<header>
  <div class="brand">
    <span class="brand-icon">🛠</span>
    <span>IT Help Desk</span>
  </div>

  <nav>
    <a href="{{ url_for('new_ticket') }}">＋ Create ticket</a>
    <a href="{{ url_for('my_tickets') }}">Track tickets</a>
    <a href="{{ url_for('admin_login') }}">Admin</a>
  </nav>
</header>

<main>
  {% for message in get_flashed_messages() %}
    <div class="notice">{{ message }}</div>
  {% endfor %}

  {% block content %}{% endblock %}
</main>
</body>
</html>
